<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Proyecto Misterio</title>

<style>
body {
    margin: 0;
    background-color: black;
    color: white;
    font-family: monospace;
    overflow-x: hidden;
}

/* SECCIÓN CONTADOR */
#contador {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 40px;
    text-align: center;
}

/* SECCIÓN IMAGEN */
#seccionImagen {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

img {
    width: 500px;
    filter: brightness(0.8);
}

.mensaje {
    margin-top: 20px;
    font-size: 20px;
    opacity: 0.7;
}
</style>
</head>

<body>

<div id="contador">
    <div id="tiempo">Cargando...</div>
</div>

<div id="seccionImagen">
    <img src="dia1.png">
    <div class="mensaje">Las puertas están abiertas...</div>
</div>

<script>

// 🔥 CAMBIA ESTA FECHA
const fechaObjetivo = new Date("March 1, 2026 00:00:00").getTime();

const intervalo = setInterval(function() {

    const ahora = new Date().getTime();
    const distancia = fechaObjetivo - ahora;

    const dias = Math.floor(distancia / (1000 * 60 * 60 * 24));
    const horas = Math.floor((distancia % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutos = Math.floor((distancia % (1000 * 60 * 60)) / (1000 * 60));
    const segundos = Math.floor((distancia % (1000 * 60)) / 1000);

    document.getElementById("tiempo").innerHTML =
        dias + "d " + horas + "h " + minutos + "m " + segundos + "s ";

    if (distancia < 0) {
        clearInterval(intervalo);
        document.getElementById("tiempo").innerHTML = "00:00:00";
    }

}, 1000);

</script>

<!-- La letra escondida es: S -->

</body>
</html>
